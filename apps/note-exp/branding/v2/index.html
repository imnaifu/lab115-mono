<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RedNote Exporter · Store assets</title>
    <!--
      Chrome Web Store assets, rendered by render.sh with headless Chrome.
      One template for every asset: ?lang=zh|en&id=s1..s5|small|marquee.
      The popup mock mirrors src/popup (Sokosoko: white header, yellow tab
      underline, same strings and icons) so the screenshots match what users actually see. All covers,
      names and numbers are made up — no real RedNote users or photos.
    -->
    <style>
      /* Sokosoko tokens — the same values as src/popup/index.css and the site's
         style.css. Yellow is a fill (ink text on it), never a text colour. */
      @font-face { font-family: "Nunito"; font-weight: 700; src: url("../../src/popup/fonts/nunito-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Nunito"; font-weight: 800; src: url("../../src/popup/fonts/nunito-latin-800-normal.woff2") format("woff2"); }
      :root {
        --paper: #ffffff;
        --paper-soft: #faf7f0;
        --paper-sunk: #f3efe6;
        --line: #e6e0d4;
        --line-strong: #8a909c;
        --ink: #2f3542;
        --ink-muted: #666b7a;
        --brand: #d03e50;
        --brand-deep: #b3303f;
        --brand-soft: #fde6e8;
        --on-brand: #ffffff;
        --highlight: #f6c6cf;
        --link: #2f6fb0;
        --success: #276b43;
        --success-soft: #e3f4ea;
        --fill-sky: #bcdcf2;
        --fill-mint: #bfe3cf;
        --fill-lilac: #d9d1f2;
        --fill-pink: #f6c6cf;
        --fill-yellow: #fdf1cc;
        --display: "Nunito", "PingFang SC", "Helvetica Neue", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { overflow: hidden; background: var(--paper-soft); }
      body {
        font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      svg { display: block; flex-shrink: 0; }
      .canvas { position: relative; overflow: hidden; background: var(--paper-soft); }
      /* Two flat pastel discs instead of glows — no gradients in this system. */
      .glow { position: absolute; inset: 0; pointer-events: none; }
      .glow::before, .glow::after { content: ""; position: absolute; border-radius: 50%; }
      .glow::before { width: 760px; height: 760px; right: -200px; top: -300px; background: var(--brand-soft); }
      .glow::after { width: 360px; height: 360px; left: -150px; bottom: -190px; background: var(--fill-sky); opacity: .55; }
      .abs { position: absolute; }
      mark { color: inherit; background: linear-gradient(transparent 62%, var(--highlight) 62%); padding: 0 3px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

      /* ---------- left copy column ---------- */
      .copy { position: absolute; left: 88px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
      .brandrow { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
      .brandrow .name { font: 800 22px/1 var(--display); }
      .pill { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--on-brand); background: var(--brand); border-radius: 99px; padding: 4px 12px; }
      .tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; font-size: 15px; font-weight: 700; letter-spacing: .04em; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 6px 16px; margin-bottom: 20px; }
      h1 { font: 700 50px/1.35 var(--display); letter-spacing: .02em; }
      .en h1 { font-size: 44px; }
      .sub { font-size: 19px; line-height: 1.7; color: var(--ink-muted); margin-top: 22px; }
      .en .sub { font-size: 18px; line-height: 1.6; }
      .bullets { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
      .bullet { display: flex; align-items: center; gap: 14px; font-size: 18px; font-weight: 700; color: var(--ink); }
      .bullet .bi { width: 42px; height: 42px; border-radius: 50%; background: var(--fill-sky); color: var(--ink); display: flex; align-items: center; justify-content: center; }
      .bullet:nth-child(2) .bi { background: var(--fill-mint); }
      .bullet:nth-child(3) .bi { background: var(--fill-lilac); }

      /* ---------- generic window chrome ---------- */
      .win { position: absolute; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 32px rgba(47, 53, 66, 0.16), 0 0 0 1px var(--line); }
      .winbar { height: 40px; background: #f3f2f1; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid #e8e6e4; }
      .dot { width: 11px; height: 11px; border-radius: 50%; }
      .url { margin-left: 14px; flex: 1; min-width: 0; height: 24px; border-radius: 6px; background: #fff; font-size: 12px; color: #9a9aa0; display: flex; align-items: center; padding: 0 10px; white-space: nowrap; overflow: hidden; }
      .wintitle { margin-left: 12px; font-size: 13px; font-weight: 600; color: #55555c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* ---------- popup mock (mirrors src/popup) ---------- */
      .popup { width: 400px; height: 600px; background: var(--paper); display: flex; flex-direction: column; font-size: 13px; position: absolute; overflow: hidden; border-radius: 14px; box-shadow: 0 12px 32px rgba(47, 53, 66, 0.18), 0 0 0 1px var(--line); transform-origin: top left; }
      .ph { display: flex; align-items: center; justify-content: space-between; background: var(--paper); height: 52px; padding: 0 16px; flex: none; }
      .ph .b { display: flex; align-items: center; gap: 8px; color: var(--ink); font: 800 15px/1 var(--display); }
      .lang { display: flex; background: var(--paper-sunk); border-radius: 99px; padding: 3px; gap: 2px; }
      .lang span { min-width: 34px; height: 26px; display: flex; align-items: center; justify-content: center; padding: 0 10px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--ink-muted); }
      .lang span.on { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
      .tabs { display: flex; gap: 20px; background: var(--paper); padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; }
      .tabs div { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 13px; height: 44px; margin-bottom: -1px; border-bottom: 3px solid transparent; color: var(--ink-muted); white-space: nowrap; }
      .tabs div.on { color: var(--ink); border-bottom-color: var(--brand); }
      .pbody { flex: 1; overflow: hidden; position: relative; }
      .pfoot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); flex: none; }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 13px; letter-spacing: .04em; height: 36px; padding: 0 16px; border-radius: 99px; border: 2px solid transparent; white-space: nowrap; }
      .btn.p { background: var(--brand); color: var(--on-brand); }
      .btn.s { background: var(--paper); color: var(--ink); border-color: var(--line-strong); }
      .muted { color: var(--ink-muted); }
      .row { display: flex; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
      .row .t { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .row .a { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
      .row .st { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--ink-muted); margin-top: 6px; }
      .row .st span { display: inline-flex; align-items: center; gap: 4px; }
      .photo { position: relative; overflow: hidden; }
      .sel { box-shadow: 0 0 0 4px var(--brand-soft), 0 0 0 5.5px var(--brand-deep); }
      .check { position: absolute; top: 6px; right: 6px; z-index: 2; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); border: 2px solid var(--brand-deep); color: var(--on-brand); display: flex; align-items: center; justify-content: center; }
      .num { position: absolute; left: 4px; top: 4px; min-width: 18px; text-align: center; font: 800 10px/16px var(--display); color: var(--ink); background: rgba(255, 255, 255, 0.92); border-radius: 99px; padding: 0 6px; }

      /* floating result card (export / download done sheet) */
      .card { position: absolute; background: var(--paper); border-radius: 20px; padding: 26px 26px 22px; text-align: center; box-shadow: 0 12px 32px rgba(47, 53, 66, 0.16), 0 0 0 1px var(--line); }
      .okc { width: 56px; height: 56px; border-radius: 50%; background: var(--success-soft); color: var(--success); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
      .card .h { font-weight: 700; font-size: 17px; margin-bottom: 14px; }
      .chip { display: flex; align-items: center; gap: 8px; background: var(--success-soft); border-radius: 12px; padding: 10px 12px; font-size: 13px; text-align: left; }
      .chip span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chip .ci { flex: none; display: flex; color: var(--success); }

      /* spreadsheet */
      table { border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
      th, td { border-right: 1px solid #e7e7ea; border-bottom: 1px solid #e7e7ea; padding: 0 9px; height: 33px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
      th { background: #f6f6f7; color: #8a8a90; font-weight: 600; font-size: 11.5px; height: 26px; text-align: center; }
      td.rn { background: #f6f6f7; color: #8a8a90; text-align: center; font-size: 11.5px; }
      tr.hdr td { font-weight: 700; background: var(--brand-soft); color: var(--ink); }
      td.n { text-align: right; font-variant-numeric: tabular-nums; }
      td.l { color: var(--link); }

      /* step cards (s5) */
      .steps { position: absolute; left: 88px; right: 88px; top: 248px; display: flex; gap: 28px; }
      .step { flex: 1; background: var(--paper); border-radius: 20px; padding: 26px 26px 28px; border: 1px solid var(--line); }
      .step .ill { height: 172px; border-radius: 12px; background: var(--paper-sunk); position: relative; overflow: hidden; margin-bottom: 22px; display: flex; align-items: center; justify-content: center; }
      .step .k { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--brand); color: var(--on-brand); font: 800 17px/1 var(--display); margin-bottom: 12px; }
      .step .tt { font: 700 22px/1.3 var(--display); }
      .step .ss { font-size: 15px; color: var(--ink-muted); margin-top: 8px; line-height: 1.55; }
      .trust { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; gap: 14px; }
      .trust div { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; color: var(--ink); background: var(--paper); border-radius: 99px; padding: 11px 20px; border: 1px solid var(--line); }
      .trust svg { color: var(--ink); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // ---------------------------------------------------------------- params
      const params = new URLSearchParams(location.search);
      const LANG = params.get("lang") === "en" ? "en" : "zh";
      const ID = params.get("id") || "s1";
      const SIZES = { small: [440, 280], marquee: [1400, 560] };
      const [W, H] = SIZES[ID] || [1280, 800];

      // ----------------------------------------------------------------- icons
      // Same stroke paths as src/popup/components/Icon.jsx.
      const PATHS = {
        search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
        list: '<path d="M9 6h12"/><path d="M9 12h12"/><path d="M9 18h12"/><circle cx="4.5" cy="6" r="0.5" fill="currentColor"/><circle cx="4.5" cy="12" r="0.5" fill="currentColor"/><circle cx="4.5" cy="18" r="0.5" fill="currentColor"/>',
        download: '<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',
        heart: '<path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21.5l8.8-8.8a5 5 0 0 0 0-7.1z"/>',
        comment: '<path d="M21 11.5a8 8 0 0 1-11.6 7.1L4 20l1.4-5.4A8 8 0 1 1 21 11.5z"/>',
        star: '<path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.9L12 16.9 6.8 19.2l1-5.9L3.5 9.2l5.9-.9z"/>',
        image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9.5" r="1.6"/><path d="M21 16l-5-5L5 20"/>',
        file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
        check: '<path d="M5 12.5l4.5 4.5L19 6.5"/>',
        x: '<path d="M6 6l12 12M18 6L6 18"/>',
        arrowdown: '<path d="M12 5v14"/><path d="M6 13l6 6 6-6"/>',
        folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
        video: '<rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10l6-3v10l-6-3z"/>',
        play: '<path d="M8 5v14l11-7z"/>',
        link: '<path d="M9 14a4 4 0 0 0 6 .5l2.5-2.5a4 4 0 0 0-5.7-5.7L10.5 7.7"/><path d="M15 10a4 4 0 0 0-6-.5L6.5 12a4 4 0 0 0 5.7 5.7L13.5 16.3"/>',
        lock: '<rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
        shield: '<path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.9-7.5-9.5V6z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/>',
        cloudoff: '<path d="M3 3l18 18"/><path d="M8.5 6.3A6 6 0 0 1 17.6 10 4 4 0 0 1 20 17"/><path d="M16.5 18H7a4.5 4.5 0 0 1-1.6-8.7"/>',
        globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>',
        puzzle: '<path d="M9 4.5a2 2 0 1 1 4 0V6h3.5a1.5 1.5 0 0 1 1.5 1.5V11h-1.5a2 2 0 1 0 0 4H18v3.5a1.5 1.5 0 0 1-1.5 1.5H13v-1.5a2 2 0 1 0-4 0V20H5.5A1.5 1.5 0 0 1 4 18.5V15h1.5a2 2 0 1 0 0-4H4V7.5A1.5 1.5 0 0 1 5.5 6H9z"/>',
        cursor: '<path d="M5 3l6.5 17 2.2-7.3L21 10.5z" fill="currentColor"/>',
      };
      // `extra` may override fill/stroke: when it sets fill=, skip the default
      // fill="none" (a duplicate attribute would be ignored, hiding solid icons).
      const ic = (name, size = 16, stroke = 2, extra = "") =>
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" ${/fill=/.test(extra) ? "" : 'fill="none"'} ${/stroke=/.test(extra) ? "" : 'stroke="currentColor"'} stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" ${extra}>${PATHS[name]}</svg>`;

      // The extension icon (icons/icon.svg), inlined so it scales crisply.
      const logo = (size) => `
        <svg width="${size}" height="${size}" viewBox="4 4 120 120" fill="none" stroke="#2f3542" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="120" height="120" rx="30" fill="#f6c6cf" stroke="none"/>
  <g transform="translate(58 60) scale(.72) translate(-66 -62)">
    
    <path d="M88 34C92 26 100 24 107 27C102 33 94 36 88 34Z" fill="#bfe3cf" stroke-width="5"/>
    <path d="M88 34C96 30 98 22 95 15C89 20 86 28 88 34Z" fill="#bfe3cf" stroke-width="5"/>
    <path d="M18 80c-4-20 14-40 42-46 30-6 52 4 56 22 4 20-16 38-46 44-26 5-48-2-52-20Z" fill="#d94b5c" stroke-width="6"/>
    
    <circle cx="48" cy="61" r="3.8" fill="#2f3542" stroke="none"/>
    <circle cx="70" cy="68" r="3.8" fill="#2f3542" stroke="none"/>
    <circle cx="84" cy="52" r="3.8" fill="#2f3542" stroke="none"/>
  </g>
  <circle cx="92" cy="92" r="19" fill="#f7c948" stroke-width="5.5"/>
  <path d="M92 82v20m-8-8 8 8 8-8" stroke-width="5.5"/>
        </svg>`;

      // The site's single-line illustrations (site/public, build script), one ink
      // line over flat pastel fills.
      const ART_OPEN = '<svg viewBox="0 0 96 96" fill="none" stroke="#2f3542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="height:84%;width:auto">';
      const ART = {
        browser: `<rect x="8" y="16" width="80" height="64" rx="6" fill="#fff"/><path d="M8 22a6 6 0 0 1 6-6h68a6 6 0 0 1 6 6v6H8Z" fill="var(--fill-sky)"/><circle cx="16" cy="22" r="1.5" fill="#2f3542" stroke="none"/><circle cx="22" cy="22" r="1.5" fill="#2f3542" stroke="none"/><circle cx="28" cy="22" r="1.5" fill="#2f3542" stroke="none"/><rect x="16" y="35" width="18" height="22" rx="3" fill="var(--fill-pink)"/><rect x="39" y="35" width="18" height="30" rx="3" fill="var(--fill-mint)"/><rect x="62" y="35" width="18" height="17" rx="3" fill="var(--fill-yellow)"/><rect x="16" y="62" width="18" height="11" rx="3" fill="var(--fill-lilac)"/><rect x="62" y="57" width="18" height="16" rx="3" fill="var(--fill-sky)"/>`,
        click: `<rect x="8" y="18" width="80" height="26" rx="13" fill="#fff"/><path d="M20 31h28"/><rect x="58" y="22" width="18" height="18" rx="5" fill="var(--fill-pink)"/><circle cx="67" cy="32" r="5" fill="#d94b5c" stroke-width="2"/><rect x="12" y="52" width="46" height="32" rx="5" fill="#fff"/><path d="M18 61h14" stroke="var(--brand)" stroke-width="4"/><path d="M38 61h14M18 71h34M18 78h22"/><path d="M66 40v26l6-6 5 11 5-2-5-11h8Z" fill="#fff"/>`,
        saved: `<path d="M14 16h28l12 12v48a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V20a4 4 0 0 1 4-4Z" fill="#fff"/><path d="M42 16v12h12M17 42h30M17 53h30M17 64h30M30 36v34"/><rect x="50" y="26" width="30" height="36" rx="4" fill="var(--fill-pink)" transform="rotate(9 65 44)"/><rect x="44" y="32" width="30" height="36" rx="4" fill="var(--fill-sky)"/><circle cx="66" cy="41" r="3" fill="var(--brand)"/><path d="M44 62 53 51l6 6 4-4 11 10v1H44Z" fill="var(--fill-mint)"/><circle cx="74" cy="74" r="12" fill="var(--brand)"/><path d="M74 67v13m-5-5 5 5 5-5"/>`,
      };
      const art = (name) => `${ART_OPEN}${ART[name]}</svg>`;

      // Abstract "photo" fills: soft layered gradients that read as blurred
      // lifestyle shots without using anyone's real image.
      const TONES = [
        ["#e9d8cc", "#c9a58e", "#f6efe6", "#8d6b57"],
        ["#d7e2dc", "#9fb7aa", "#f3f6f1", "#5f7d6f"],
        ["#eadbe2", "#c7a2b5", "#fbf1f4", "#8b5f74"],
        ["#dbe1ec", "#9fb0cc", "#f3f5fa", "#5b6f93"],
        ["#efe3cf", "#d2b07a", "#fbf5ea", "#9b7a43"],
        ["#d9e7e8", "#93bcc0", "#f1f8f8", "#4f8489"],
        ["#f0dcd6", "#d59a8b", "#fcf1ee", "#9c5b4d"],
        ["#e2e4d8", "#b4b98f", "#f5f6ee", "#757a4f"],
        ["#e6dcef", "#ad97c9", "#f6f2fb", "#6d5a8c"],
      ];
      const fill = (seed) => {
        const t = TONES[((seed % TONES.length) + TONES.length) % TONES.length];
        const x1 = 20 + ((seed * 37) % 60), y1 = 15 + ((seed * 53) % 50);
        const x2 = 30 + ((seed * 71) % 60), y2 = 55 + ((seed * 29) % 40);
        return `background:
          radial-gradient(circle at ${x1}% ${y1}%, ${t[2]} 0, transparent 42%),
          radial-gradient(ellipse at ${x2}% ${y2}%, ${t[3]}aa 0, transparent 55%),
          linear-gradient(160deg, ${t[0]}, ${t[1]});`;
      };
      const photo = (seed, style = "", inner = "", cls = "") =>
        `<div class="photo ${cls}" style="${fill(seed)}${style}">${inner}</div>`;

      // ------------------------------------------------------------------ copy
      const T = {
        zh: {
          brand: "小红书导出工具",
          ext: "Chrome 扩展",
          tabList: "导出笔记列表",
          tabPost: "下载单帖资源",
          notes: [
            ["秋天第一件风衣的 5 套通勤穿搭", "盐系小柯", "4.4w", "1.3w", "883", "2026-09-28"],
            ["小个子梨形身材的秋冬穿搭法则", "今天也很会穿", "4.8w", "1.7w", "1.4k", "2026-10-02"],
            ["周末去哪儿｜杭州 8 家小众咖啡馆", "阿梨在路上", "2.1w", "9.6k", "512", "2026-10-06"],
            ["一人食晚餐｜15 分钟搞定三菜一汤", "厨房小林", "3.2w", "2.4w", "1.1k", "2026-10-09"],
            ["新手入门胶片相机，这些坑别踩", "慢门日记", "1.6w", "8.8k", "640", "2026-10-11"],
            ["租房改造｜500 元让出租屋变温馨", "住进光里", "6.7w", "5.1w", "2.3k", "2026-10-12"],
            ["秋冬护肤顺序，一张图讲清楚", "成分党小周", "2.9w", "3.6w", "970", "2026-10-13"],
          ],

                <tr class="hdr"><td class="rn" style="background:#f6f6f7;color:#8a8a90;font-weight:400">1</td>${headers.map((h) => `<td>${h}</td>`).join("")}</tr>
                ${body}
                ${[9, 10, 11, 12, 13, 14].map((r) => `<tr><td class="rn">${r}</td>${"<td></td>".repeat(8)}</tr>`).join("")}
              </table>
              <div style="position:absolute;right:0;top:74px;bottom:0;width:120px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff)"></div>
            </div>
            <div class="card" style="left:580px;top:560px;width:360px">
              <div class="okc">${ic("check", 26, 2.6)}</div>
              <div class="h">${T.exportDone}</div>
              <div class="chip"><span class="ci">${ic("file", 16)}</span><span>2026-10-15 14-35-21 rednote-notes.csv</span><b style="color:var(--ink-muted);font-weight:700">${T.rows}</b></div>
              <div style="font-size:12.5px;color:var(--ink-muted);margin-top:9px">${T.savedTo}</div>
            </div>`;
        },

        s5: () => {
          const ill = [
            ["browser", "var(--fill-sky)"],
            ["click", "var(--fill-pink)"],
            ["saved", "var(--fill-mint)"],
          ];
          return `
            <div class="abs" style="left:0;right:0;top:70px;display:flex;flex-direction:column;align-items:center;gap:18px">
              <div class="brandrow" style="margin:0">${logo(46)}<span class="name">${T.brand}</span><span class="pill">${T.ext}</span></div>
              <div style="font:700 ${LANG === "zh" ? 44 : 42}px/1.4 var(--display);letter-spacing:.02em">${T.s5.title}</div>
            </div>
            <div class="steps">${T.s5.steps.map(([tt, ss], i) => `<div class="step"><div class="ill" style="background:${ill[i][1]}">${art(ill[i][0])}</div><div class="k">${i + 1}</div><div class="tt">${tt}</div><div class="ss">${ss}</div></div>`).join("")}</div>
            <div class="trust">${T.s5.trust.map(([i, t]) => `<div>${ic(i, 19, 2)}${t}</div>`).join("")}</div>`;
        },

        small: () => `
          <div class="abs" style="right:-90px;top:-110px;width:280px;height:280px;border-radius:50%;background:var(--brand-soft)"></div>
          <div class="abs" style="left:36px;top:0;bottom:0;right:28px;display:flex;flex-direction:column;justify-content:center">
            ${logo(78)}
            <div style="font:700 ${LANG === "zh" ? 40 : 36}px/1.3 var(--display);margin-top:22px">${T.small[0]}</div>
            <div style="font-size:${LANG === "zh" ? 19 : 17}px;font-weight:700;color:var(--ink-muted);margin-top:12px">${T.small[1]}</div>
          </div>`,

        marquee: () => {
          const m = T.marquee;
          return `
            <div class="abs" style="left:88px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center">
              <div class="brandrow" style="margin-bottom:28px">${logo(58)}<span class="name" style="font-size:24px">${T.brand}</span><span class="pill">${T.ext}</span></div>
              <div style="font:700 ${LANG === "zh" ? 50 : 46}px/1.35 var(--display);letter-spacing:.02em">${m.h1}</div>
              <div style="font-size:19px;line-height:1.6;color:var(--ink-muted);margin-top:14px">${m.sub}</div>
              <div style="display:flex;gap:10px;margin-top:28px;flex-wrap:wrap">${m.chips.map(([i, t]) => `<span style="display:inline-flex;align-items:center;gap:7px;font-size:16px;font-weight:700;color:var(--ink);background:#fff;border-radius:99px;padding:9px 16px;box-shadow:0 0 0 1px var(--line)"><span style="color:var(--ink)">${ic(i, 17, 2.2)}</span>${t}</span>`).join("")}</div>
            </div>
            ${popup(listTab(), 790, 72, 0.92)}
            ${popup(postTab(), 1000, 36, 0.92)}`;
        },
      };

      // ----------------------------------------------------------------- mount
      document.documentElement.style.width = W + "px";
      document.documentElement.style.height = H + "px";
      document.body.className = LANG;
      const root = document.getElementById("root");
      root.className = "canvas " + LANG;
      root.style.width = W + "px";
      root.style.height = H + "px";
      root.innerHTML = `${ID === "small" ? "" : '<div class="glow"></div>'}${(scenes[ID] || scenes.s1)()}`;
    </script>
  </body>
</html>
