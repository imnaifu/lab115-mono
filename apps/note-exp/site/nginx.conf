server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Traefik terminates TLS in front of this, so nginx only ever sees http on
    # port 80. Its own redirects (/en -> /en/) must stay relative, or the
    # Location header would point at http:// and cost an extra hop.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ =404;
    }

    # English used to live under /en/; it is the default language at the root
    # now (Chinese moved to /zh/). Keep every old /en link working, and make it
    # permanent so search engines move the old URLs' signals to the new ones.
    location = /en {
        return 301 /;
    }
    location ^~ /en/ {
        rewrite ^/en/(.*)$ /$1 permanent;
    }

    # Pages are tiny and change with each deploy: always revalidate.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
    # Images and the stylesheet keep their names across deploys, so cache them
    # for a day rather than "forever"; a changed screenshot shows up by tomorrow.
    location ~* \.(webp|jpg|png|svg|css|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
