html/head_include="<meta name=\"description\" content=\"大厂幸存者 Big Tech Survivors：割草类 roguelike，躲开 Bug、会议和 Deadline，撑过 10 分钟就能敲钟上市。\">\n<meta name=\"theme-color\" content=\"#dcefc6\">\n<style>body { background-color: #dcefc6; } #status-progress { accent-color: #5b9cff; }</style>\n<!-- A phone set to landscape draws the game turned a quarter turn while upright (Game.apply_orientation). That choice is mirrored to localStorage (Device.prefers_landscape) so the loading screen can turn the same way, top edge along the screen's right, from the first frame. Phones in portrait, the default, leave it upright. -->\n<script>try { if (localStorage.getItem('survivors-orientation') === 'landscape') { document.documentElement.classList.add('force-landscape'); } } catch (error) {}</script>\n<style>@media (orientation: portrait) and (pointer: coarse) { html.force-landscape #status { left: 100vw; top: 0; right: auto; bottom: auto; width: 100vh; width: 100dvh; height: 100vw; transform: rotate(90deg); transform-origin: top left; } }</style>\n<!-- The game used to install as a PWA. Drop any service worker and caches left over from then, so this page and the next load come from the network (tools/service_worker_removal.js does the same from the worker side). -->\n<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function (registrations) { registrations.forEach(function (registration) { registration.unregister(); }); }); } if (window.caches) { caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); }); }</script>
<!-- Link previews (Slack, Telegram, iMessage; WeChat mostly uses the title). -->
<meta property=\"og:title\" content=\"大厂幸存者 Big Tech Survivors\"><meta property=\"og:description\" content=\"躲开 Bug、会议和 Deadline，撑过 10 分钟就能敲钟上市。打开网页就能玩，手机电脑都行。\"><meta property=\"og:image\" content=\"https://survivors.lab115.com/index.png\"><meta property=\"og:url\" content=\"https://survivors.lab115.com/\"><meta property=\"og:type\" content=\"website\"><meta name=\"twitter:card\" content=\"summary_large_image\">
<!-- Anonymous play data for tuning (scripts/telemetry.gd): game_ready / run_start / run_end events go to the self-hosted Umami at stats.lab115.com once its script below is up. The game snapshots a run in progress to localStorage; if the page closes mid-run, that snapshot goes out as a \"quit\" on pagehide or when the page is hidden (Umami sends with keepalive), and again on the next visit, which only then forgets it. Script errors (the page's, and the engine's, which it prints with console.error) go out as js_error, a few per page. A tab brought back after a new release, with no run going, reloads into it (version.txt, written by tools/export_web.sh). -->
<script>(function () { /* One saved snapshot per run, under 'survivors-run:<run id>' (the bare key is the old single one). */ var KEY = 'survivors-run'; function track(name, data, tries) { if (window.umami) { window.umami.track(name, data); } else if ((tries || 0) < 30) { setTimeout(function () { track(name, data, (tries || 0) + 1); }, 1000); } } function runKeys() { var keys = []; try { for (var i = 0; i < localStorage.length; i++) { var key = localStorage.key(i); if (key === KEY || key.indexOf(KEY + ':') === 0) { keys.push(key); } } } catch (error) {} return keys; } /* Sends saved runs as quits. On page close they are kept: in-app browsers often close before the request is out, so the next visit sends them again and only then forgets them (a run can arrive twice; queries keep its longest copy). */ function flush(keys, keep) { if (!window.umami) { return; } keys.forEach(function (key) { try { var pending = localStorage.getItem(key); if (pending) { if (!keep) { localStorage.removeItem(key); } window.umami.track('run_end', JSON.parse(pending)); } } catch (error) {} }); } /* Only what was left from earlier visits: a run started on this page is still going. */ var leftOver = runKeys(); function flushWhenReady(tries) { if (window.umami) { flush(leftOver, false); } else if (tries < 30) { setTimeout(function () { flushWhenReady(tries + 1); }, 1000); } } /* The run going on this page, and the version the game reported (Telemetry.on_title_shown). */ var running = ''; var version = ''; var lastCheck = 0; /* Back from the background after a release, with no run going: reload into the new version, at most one check a minute. */ function checkVersion() { if (!version || running || Date.now() - lastCheck < 60000) { return; } lastCheck = Date.now(); fetch('version.txt', { cache: 'no-store' }).then(function (response) { return response.ok ? response.text() : ''; }).then(function (live) { live = live.trim(); if (live && live !== version && !running) { location.reload(); } }).catch(function () {}); } var errorsLeft = 5; function reportError(message, where) { if (errorsLeft <= 0) { return; } errorsLeft--; track('js_error', { version: version, message: String(message).slice(0, 300), where: String(where || '').slice(0, 200) }); } window.addEventListener('error', function (event) { reportError(event.message, (event.filename || '') + ':' + (event.lineno || 0)); }); window.addEventListener('unhandledrejection', function (event) { reportError(event.reason && event.reason.message || event.reason, 'promise'); }); var consoleError = console.error; console.error = function () { try { var message = Array.prototype.join.call(arguments, ' '); if (message.indexOf('ERROR') >= 0) { reportError(message, 'engine'); } } catch (error) {} return consoleError.apply(console, arguments); }; window.survivorsTelemetry = { track: track, snapshot: function (json) { try { running = JSON.parse(json).run; localStorage.setItem(KEY + ':' + running, json); } catch (error) {} }, clear: function (run) { if (run === running) { running = ''; } try { localStorage.removeItem(KEY + ':' + run); } catch (error) {} }, setVersion: function (value) { version = value; } }; flushWhenReady(0); window.addEventListener('pagehide', function () { flush(runKeys(), true); }); /* Phones often hide a page and kill it later without a pagehide. */ document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { flush(runKeys(), true); } else { checkVersion(); } }); window.addEventListener('pageshow', function (event) { if (event.persisted) { checkVersion(); } }); })();</script>
<!-- The end screen's result image (scripts/ui/share_card.gd), shown over the game: press and hold to save or forward it (what WeChat users do), the share sheet where the browser can share files, or a download. -->
<script>window.survivorsShare = { show: function (base64, hint, shareText, saveText, closeText, photosHint) { var old = document.getElementById('survivors-share'); if (old) { old.remove(); } var bytes = atob(base64); var array = new Uint8Array(bytes.length); for (var i = 0; i < bytes.length; i++) { array[i] = bytes.charCodeAt(i); } var blob = new Blob([array], { type: 'image/png' }); var url = URL.createObjectURL(blob); var layer = document.createElement('div'); layer.id = 'survivors-share'; layer.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;box-sizing:border-box;background:rgba(250,247,240,0.96);font:600 15px/1.4 -apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Noto Sans SC\",sans-serif;color:#2f3542;text-align:center;-webkit-user-select:none;user-select:none;'; /* Only the image is selectable, so a long press that gets no image menu doesn't select the hint instead. */ var image = document.createElement('img'); image.src = 'data:image/png;base64,' + base64; image.alt = ''; image.style.cssText = 'max-width:min(90vw,420px);max-height:72vh;border-radius:16px;box-shadow:0 6px 24px rgba(47,53,66,0.18);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;'; var note = document.createElement('div'); note.textContent = hint; var row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;'; function button(text, primary, action) { var element = document.createElement('button'); element.textContent = text; element.style.cssText = 'font:inherit;padding:8px 20px;border-radius:999px;cursor:pointer;color:#2f3542;border:2px solid ' + (primary ? '#f7c948;background:#f7c948;' : '#8a909c;background:#ffffff;'); element.addEventListener('click', action); row.appendChild(element); } function close() { layer.remove(); URL.revokeObjectURL(url); window.removeEventListener('keydown', keys, true); } /* Keys are for this layer while it is up, not the game behind it (R would restart). */ function keys(event) { event.stopImmediatePropagation(); if (event.key === 'Escape') { close(); } } var file = window.File ? new File([blob], 'survivors.png', { type: 'image/png' }) : null; var canShareFile = !!(file && navigator.canShare && navigator.canShare({ files: [file] })); function shareFile() { navigator.share({ files: [file] }).catch(function () {}); } var weChat = /MicroMessenger/i.test(navigator.userAgent); /* iOS browsers download into the Files app, never Photos, and Chrome there gives the image no menu on a long press; the share sheet's Save Image is what reaches Photos. iPadOS says it is a Mac, hence the touch check. */ var saveToPhotos = canShareFile && !weChat && (/iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)); if (saveToPhotos) { note.textContent = photosHint; } if (canShareFile) { button(shareText, true, shareFile); } /* WeChat's browser can't download; pressing and holding the image is how it saves. */ if (saveToPhotos) { button(saveText, false, shareFile); } else if (!weChat) { button(saveText, false, function () { var link = document.createElement('a'); link.href = url; link.download = 'survivors.png'; document.body.appendChild(link); link.click(); link.remove(); }); } button(closeText, false, close); layer.appendChild(image); layer.appendChild(note); layer.appendChild(row); document.body.appendChild(layer); window.addEventListener('keydown', keys, true); } };</script>\n<script defer src=\"https://stats.lab115.com/s.js\" data-website-id=\"9964fbf9-2ee4-4776-b017-ee567f898758\" data-domains=\"survivors.lab115.com\"></script>"
