html/head_include="<meta name=\"description\" content=\"硅谷幸存者 Silicon Valley Survivors：割草类 roguelike，躲开 Bug、会议和 Deadline，撑过 10 分钟就能敲钟上市。\">\n<meta name=\"theme-color\" content=\"#dcefc6\">\n<style>body { background-color: #dcefc6; } #status-progress { accent-color: #5b9cff; }</style>\n<!-- On an upright phone the game draws itself turned a quarter turn (Game._apply_orientation). Turn the loading screen the same way, top edge along the screen's right, so it is landscape from the first frame. -->\n<style>@media (orientation: portrait) and (pointer: coarse) { #status { left: 100vw; top: 0; right: auto; bottom: auto; width: 100vh; width: 100dvh; height: 100vw; transform: rotate(90deg); transform-origin: top left; } }</style>\n<!-- The game used to install as a PWA. Drop any service worker and caches left over from then, so this page and the next load come from the network (tools/service_worker_removal.js does the same from the worker side). -->\n<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function (registrations) { registrations.forEach(function (registration) { registration.unregister(); }); }); } if (window.caches) { caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); }); }</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
