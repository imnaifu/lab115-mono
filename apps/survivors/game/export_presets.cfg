html/head_include="<meta name=\"description\" content=\"硅谷幸存者 Silicon Valley Survivors：割草类 roguelike，躲开 Bug、会议和 Deadline，撑过 10 分钟就能敲钟上市。\">\n<meta name=\"theme-color\" content=\"#dcefc6\">\n<style>body { background-color: #dcefc6; } #status-progress { accent-color: #5b9cff; }</style>\n<!-- A phone set to landscape draws the game turned a quarter turn while upright (Game.apply_orientation). That choice is mirrored to localStorage (Device.prefers_landscape) so the loading screen can turn the same way, top edge along the screen's right, from the first frame. Phones in portrait, the default, leave it upright. -->\n<script>try { if (localStorage.getItem('survivors-orientation') === 'landscape') { document.documentElement.classList.add('force-landscape'); } } catch (error) {}</script>\n<style>@media (orientation: portrait) and (pointer: coarse) { html.force-landscape #status { left: 100vw; top: 0; right: auto; bottom: auto; width: 100vh; width: 100dvh; height: 100vw; transform: rotate(90deg); transform-origin: top left; } }</style>\n<!-- The game used to install as a PWA. Drop any service worker and caches left over from then, so this page and the next load come from the network (tools/service_worker_removal.js does the same from the worker side). -->\n<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function (registrations) { registrations.forEach(function (registration) { registration.unregister(); }); }); } if (window.caches) { caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); }); }</script>
<!-- Anonymous play data for tuning (scripts/telemetry.gd): run_start / run_end events go to the self-hosted Umami at stats.lab115.com once its script below is up. The game snapshots a run in progress to localStorage; if the page closes mid-run, that snapshot goes out as a \"quit\" on pagehide (Umami sends with keepalive), or on the next visit if Umami hadn't loaded by then. -->
<script>(function () { var KEY = 'survivors-run'; function track(name, data, tries) { if (window.umami) { window.umami.track(name, data); } else if ((tries || 0) < 30) { setTimeout(function () { track(name, data, (tries || 0) + 1); }, 1000); } } function flush() { try { var pending = localStorage.getItem(KEY); if (pending && window.umami) { localStorage.removeItem(KEY); window.umami.track('run_end', JSON.parse(pending)); } } catch (error) {} } function flushWhenReady(tries) { if (window.umami) { flush(); } else if (tries < 30) { setTimeout(function () { flushWhenReady(tries + 1); }, 1000); } } window.survivorsTelemetry = { track: track, snapshot: function (json) { try { localStorage.setItem(KEY, json); } catch (error) {} }, clear: function () { try { localStorage.removeItem(KEY); } catch (error) {} } }; flushWhenReady(0); window.addEventListener('pagehide', flush); })();</script>\n<script defer src=\"https://stats.lab115.com/s.js\" data-website-id=\"9964fbf9-2ee4-4776-b017-ee567f898758\" data-domains=\"survivors.lab115.com\"></script>"
