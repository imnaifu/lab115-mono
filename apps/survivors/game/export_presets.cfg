html/head_include="<meta name=\"description\" content=\"大厂幸存者 Big Tech Survivors：割草类 roguelike，躲开 Bug、会议和 Deadline，撑过 10 分钟就能敲钟上市。\">\n<meta name=\"theme-color\" content=\"#dcefc6\">\n<style>body { background-color: #dcefc6; } #status-progress { accent-color: #5b9cff; }</style>\n<!-- A phone set to landscape draws the game turned a quarter turn while upright (Game.apply_orientation). That choice is mirrored to localStorage (Device.prefers_landscape) so the loading screen can turn the same way, top edge along the screen's right, from the first frame. Phones in portrait, the default, leave it upright. -->\n<script>try { if (localStorage.getItem('survivors-orientation') === 'landscape') { document.documentElement.classList.add('force-landscape'); } } catch (error) {}</script>\n<style>@media (orientation: portrait) and (pointer: coarse) { html.force-landscape #status { left: 100vw; top: 0; right: auto; bottom: auto; width: 100vh; width: 100dvh; height: 100vw; transform: rotate(90deg); transform-origin: top left; } }</style>\n<!-- The game used to install as a PWA. Drop any service worker and caches left over from then, so this page and the next load come from the network (tools/service_worker_removal.js does the same from the worker side). -->\n<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function (registrations) { registrations.forEach(function (registration) { registration.unregister(); }); }); } if (window.caches) { caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); }); }</script>
<!-- Link previews (Slack, Telegram, iMessage; WeChat mostly uses the title). -->
<meta property=\"og:title\" content=\"大厂幸存者 Big Tech Survivors\"><meta property=\"og:description\" content=\"躲开 Bug、会议和 Deadline，撑过 10 分钟就能敲钟上市。打开网页就能玩，手机电脑都行。\"><meta property=\"og:image\" content=\"https://survivors.lab115.com/index.png\"><meta property=\"og:url\" content=\"https://survivors.lab115.com/\"><meta property=\"og:type\" content=\"website\"><meta name=\"twitter:card\" content=\"summary_large_image\">
<!-- Anonymous play data for tuning (scripts/telemetry.gd): game_ready / run_start / run_end events go to the self-hosted Umami at stats.lab115.com once its script below is up. The game snapshots a run in progress to localStorage; if the page closes mid-run, that snapshot goes out as a \"quit\" on pagehide or when the page is hidden (Umami sends with keepalive), and again on the next visit, which only then forgets it. Script errors (the page's, and the engine's, which it prints with console.error) go out as js_error, a few per page. A tab brought back after a new release, with no run going, reloads into it (version.txt, written by tools/export_web.sh). -->
<script>(function () { /* One saved snapshot per run, under 'survivors-run:<run id>' (the bare key is the old single one). */ var KEY = 'survivors-run'; /* A load given up before the game was up, kept for the next visit when Umami's script wasn't up either. */ var LOAD_KEY = 'survivors-load'; function randomId(length) { var text = ''; for (var i = 0; i < length; i++) { text += Math.floor(Math.random() * 16).toString(16); } return text; } /* Every event carries `install`, a random id this browser keeps (localStorage, cleared with the site's data), to count players and follow them from visit to visit with nothing about who they are; `page`, one per page load, tying a load, its runs and what happened on it together (Umami's own session changes with the network); and `account`, the cloud save's, once known. */ var install = ''; try { install = localStorage.getItem('survivors-install') || ''; if (!install) { install = randomId(16); localStorage.setItem('survivors-install', install); } } catch (error) { install = install || randomId(16); } var page = randomId(8); /* The cloud save's account (Nakama user id) once it has signed in: Telemetry.set_account. */ var account = ''; /* The run going on this page, and the version the game reported (Telemetry.on_title_shown). */ var running = ''; var version = ''; var lastCheck = 0; /* Fills in what every event carries, keeping what it already has: a run saved on an earlier page keeps that page. */ function stamp(data) { data = data || {}; if (!data.install) { data.install = install; } if (!data.page) { data.page = page; } if (!data.account && account) { data.account = account; } if (!data.version && version) { data.version = version; } return data; } function track(name, data, tries) { if (window.umami) { window.umami.track(name, stamp(data)); } else if ((tries || 0) < 30) { setTimeout(function () { track(name, data, (tries || 0) + 1); }, 1000); } } function runKeys() { var keys = []; try { for (var i = 0; i < localStorage.length; i++) { var key = localStorage.key(i); if (key === KEY || key.indexOf(KEY + ':') === 0) { keys.push(key); } } } catch (error) {} return keys; } /* Sends saved runs as quits. On page close they are kept: in-app browsers often close before the request is out, so the next visit sends them again and only then forgets them (a run can arrive twice; queries keep its longest copy). */ function flush(keys, keep) { if (!window.umami) { return; } keys.forEach(function (key) { try { var pending = localStorage.getItem(key); if (pending) { if (!keep) { localStorage.removeItem(key); } window.umami.track('run_end', stamp(JSON.parse(pending))); } } catch (error) {} }); } /* Only what was left from earlier visits: a run started on this page is still going. */ var leftOver = runKeys(); function flushWhenReady(tries) { if (window.umami) { flush(leftOver, false); try { var load = localStorage.getItem(LOAD_KEY); if (load) { localStorage.removeItem(LOAD_KEY); window.umami.track('load_abandoned', JSON.parse(load)); } } catch (error) {} } else if (tries < 30) { setTimeout(function () { flushWhenReady(tries + 1); }, 1000); } } /* A page hidden or closed before the game was up (game_ready, which reports the version): how long it had waited and how far the download had got, to tell a slow network from leaving at once. A phone that only switched apps for a moment sends it too; the same page's game_ready shows it came back. Once per page. */ var loadReported = false; function loadAbandoned() { if (version || loadReported) { return; } loadReported = true; var bar = document.getElementById('status-progress'); var data = stamp({ ms: Math.round(performance.now()), progress: bar && bar.max > 0 ? Math.round(100 * bar.value / bar.max) : -1 }); if (window.umami) { window.umami.track('load_abandoned', data); } else { try { localStorage.setItem(LOAD_KEY, JSON.stringify(data)); } catch (error) {} } } /* Back from the background after a release, with no run going: reload into the new version, at most one check a minute. */ function checkVersion() { if (!version || running || Date.now() - lastCheck < 60000) { return; } lastCheck = Date.now(); fetch('version.txt', { cache: 'no-store' }).then(function (response) { return response.ok ? response.text() : ''; }).then(function (live) { live = live.trim(); if (live && live !== version && !running) { location.reload(); } }).catch(function () {}); } var errorsLeft = 5; function reportError(message, where) { if (errorsLeft <= 0) { return; } errorsLeft--; track('js_error', { message: String(message).slice(0, 300), where: String(where || '').slice(0, 200) }); } window.addEventListener('error', function (event) { reportError(event.message, (event.filename || '') + ':' + (event.lineno || 0)); }); window.addEventListener('unhandledrejection', function (event) { reportError(event.reason && event.reason.message || event.reason, 'promise'); }); var consoleError = console.error; console.error = function () { try { var message = Array.prototype.join.call(arguments, ' '); if (message.indexOf('ERROR') >= 0) { reportError(message, 'engine'); } } catch (error) {} return consoleError.apply(console, arguments); }; window.survivorsTelemetry = { track: track, snapshot: function (json) { try { var data = stamp(JSON.parse(json)); running = data.run; localStorage.setItem(KEY + ':' + running, JSON.stringify(data)); } catch (error) {} }, clear: function (run) { if (run === running) { running = ''; } try { localStorage.removeItem(KEY + ':' + run); } catch (error) {} }, setVersion: function (value) { version = value; }, setAccount: function (value) { account = value; } }; flushWhenReady(0); window.addEventListener('pagehide', function () { loadAbandoned(); flush(runKeys(), true); }); /* Phones often hide a page and kill it later without a pagehide. */ document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { loadAbandoned(); flush(runKeys(), true); } else { checkVersion(); } }); window.addEventListener('pageshow', function (event) { if (event.persisted) { checkVersion(); } }); })();</script>
<!-- The end screen's result image (scripts/ui/share_card.gd), shown over the game: press and hold to save or forward it (what WeChat users do), the share sheet where the browser can share files, or a download. -->
<script>window.survivorsShare = { show: function (base64, hint, shareText, saveText, closeText, photosHint) { /* Which of its buttons get used (`share`; Hud._make_share_image sends the opening). A long press on the image can't be seen. */ function report(action) { if (window.survivorsTelemetry) { window.survivorsTelemetry.track('share', { action: action }); } } var old = document.getElementById('survivors-share'); if (old) { old.remove(); } var bytes = atob(base64); var array = new Uint8Array(bytes.length); for (var i = 0; i < bytes.length; i++) { array[i] = bytes.charCodeAt(i); } var blob = new Blob([array], { type: 'image/png' }); var url = URL.createObjectURL(blob); var layer = document.createElement('div'); layer.id = 'survivors-share'; layer.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px 16px max(16px, env(safe-area-inset-bottom));box-sizing:border-box;background:rgba(250,247,240,0.96);font:600 15px/1.4 -apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Noto Sans SC\",sans-serif;color:#2f3542;text-align:center;-webkit-user-select:none;user-select:none;'; /* Only the image is selectable, so a long press that gets no image menu doesn't select the hint instead. */ var image = document.createElement('img'); image.src = 'data:image/png;base64,' + base64; image.alt = ''; image.style.cssText = 'max-width:min(90vw,420px);max-height:60vh;border-radius:16px;box-shadow:0 6px 24px rgba(47,53,66,0.18);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;'; var note = document.createElement('div'); note.textContent = hint; var row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px;flex-wrap:wrap;justify-content:center;'; function button(text, primary, action) { var element = document.createElement('button'); element.textContent = text; element.style.cssText = 'font:inherit;padding:8px 20px;border-radius:999px;cursor:pointer;color:#2f3542;border:2px solid ' + (primary ? '#f7c948;background:#f7c948;' : '#8a909c;background:#ffffff;'); element.addEventListener('click', action); row.appendChild(element); } function close() { layer.remove(); URL.revokeObjectURL(url); window.removeEventListener('keydown', keys, true); window.removeEventListener('resize', fit); } /* Keys are for this layer while it is up, not the game behind it (R would restart). */ function keys(event) { event.stopImmediatePropagation(); if (event.key === 'Escape') { close(); } } var file = window.File ? new File([blob], 'survivors.png', { type: 'image/png' }) : null; var canShareFile = !!(file && navigator.canShare && navigator.canShare({ files: [file] })); function shareFile() { navigator.share({ files: [file] }).then(function () { report('shared'); }, function () { report('share_cancelled'); }); } var weChat = /MicroMessenger/i.test(navigator.userAgent); /* iOS browsers download into the Files app, never Photos, and Chrome there gives the image no menu on a long press; the share sheet's Save Image is what reaches Photos. iPadOS says it is a Mac, hence the touch check. */ var saveToPhotos = canShareFile && !weChat && (/iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)); if (saveToPhotos) { note.textContent = photosHint; } if (canShareFile) { button(shareText, true, function () { report('share'); shareFile(); }); } /* WeChat's browser can't download; pressing and holding the image is how it saves. */ if (saveToPhotos) { button(saveText, false, function () { report('save'); shareFile(); }); } else if (!weChat) { button(saveText, false, function () { report('save'); var link = document.createElement('a'); link.href = url; link.download = 'survivors.png'; document.body.appendChild(link); link.click(); link.remove(); }); } button(closeText, false, function () { report('close'); close(); }); layer.appendChild(image); layer.appendChild(note); layer.appendChild(row); document.body.appendChild(layer); window.addEventListener('keydown', keys, true); /* The image gets the height left once the hint and the buttons have theirs. On a phone the area between the browser's bars is shorter than vh, and an image sized by vh pushed the buttons under the bottom bar and the card's top under the address bar. */ function fit() { var style = getComputedStyle(layer); var room = layer.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom) - note.offsetHeight - row.offsetHeight - 24; image.style.maxHeight = Math.max(120, room) + 'px'; } fit(); window.addEventListener('resize', fit); } };</script>\n<script>/* The 云存档 page (Hud._copy_code, Hud._ask_code): a dialog showing the 存档码 in a field with a copy button, and one with a field to type a code into. The page's own because copying needs the tap itself, which the game only hears a frame later, and the game's text fields bring up no keyboard on a phone; a long press on the field still copies where the browser won't (WeChat). */ window.survivorsCode = (function () { /* What happens in the dialogs (cloud_action; the game sends the rest): copying the code, and giving up on entering one. */ function report(action, result) { if (window.survivorsTelemetry) { window.survivorsTelemetry.track('cloud_action', result ? { action: action, result: result } : { action: action }); } } function layer(build) { var old = document.getElementById('survivors-code'); if (old) { old.remove(); } var back = document.createElement('div'); back.id = 'survivors-code'; back.style.cssText = 'position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(28,31,38,0.48);font:600 15px/1.4 -apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Noto Sans SC\",sans-serif;color:#2f3542;'; var card = document.createElement('div'); card.style.cssText = 'width:min(100%,360px);display:flex;flex-direction:column;gap:12px;padding:20px;box-sizing:border-box;background:#ffffff;border:2px solid #2f3542;border-radius:20px;box-shadow:0 4px 0 #2f3542;text-align:center;'; back.appendChild(card); var submit = null; function close() { back.remove(); window.removeEventListener('keydown', keys, true); } /* Keys are for this dialog while it is up, not the game behind it. */ function keys(event) { event.stopImmediatePropagation(); if (event.key === 'Escape') { close(); } else if (event.key === 'Enter' && submit) { submit(); } } window.addEventListener('keydown', keys, true); document.body.appendChild(back); submit = build(card, close); } function text(card, value, size, muted) { var line = document.createElement('div'); line.textContent = value; line.style.cssText = 'font-size:' + size + 'px;' + (muted ? 'color:#666b7a;font-weight:400;' : 'font-weight:800;'); card.appendChild(line); return line; } function field(card, value) { var input = document.createElement('input'); input.value = value; input.setAttribute('autocomplete', 'off'); input.setAttribute('autocorrect', 'off'); input.setAttribute('autocapitalize', 'characters'); input.setAttribute('spellcheck', 'false'); input.style.cssText = 'font:800 22px/1.2 ui-monospace,Menlo,monospace;letter-spacing:2px;text-align:center;padding:10px;border:2px solid #8a909c;border-radius:12px;background:#f3efe6;color:#2f3542;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;'; card.appendChild(input); return input; } function buttons(card) { var row = document.createElement('div'); row.style.cssText = 'display:flex;gap:10px;justify-content:center;flex-wrap:wrap;'; card.appendChild(row); return function (label, primary, action) { var button = document.createElement('button'); button.textContent = label; button.style.cssText = 'font:inherit;padding:8px 20px;border-radius:999px;cursor:pointer;color:#2f3542;border:2px solid ' + (primary ? '#f7c948;background:#f7c948;' : '#8a909c;background:#ffffff;'); button.addEventListener('click', action); row.appendChild(button); return button; }; } return { show: function (code, title, hint, copyText, copiedText, holdHint, closeText) { layer(function (card, close) { text(card, title, 18); var input = field(card, code); input.readOnly = true; var note = text(card, hint, 13, true); var add = buttons(card); var copy = add(copyText, true, function () { function copied() { copy.textContent = copiedText; report('copied', 'ok'); } /* The older way, and failing that, say how to copy by hand. */ function fallback() { var done = false; input.focus(); input.select(); input.setSelectionRange(0, code.length); try { done = document.execCommand('copy'); } catch (error) {} if (done) { copied(); } else { note.textContent = holdHint; report('copied', 'hold'); } } if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(code).then(copied, fallback); } else { fallback(); } }); add(closeText, false, close); return null; }); }, ask: function (title, hint, placeholder, okText, cancelText, done) { layer(function (card, close) { text(card, title, 18); text(card, hint, 13, true); var input = field(card, ''); input.placeholder = placeholder; input.maxLength = 20; var add = buttons(card); function submit() { var value = input.value; close(); done(value); } add(okText, true, submit); add(cancelText, false, function () { report('redeem_cancelled'); close(); }); input.focus(); return submit; }); } }; })();</script>\n<script defer src=\"https://stats.lab115.com/s.js\" data-website-id=\"9964fbf9-2ee4-4776-b017-ee567f898758\" data-domains=\"survivors.lab115.com\"></script>"
