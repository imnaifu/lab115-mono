server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.wasm / index.pck / index.js are pre-gzipped at image build (see Dockerfile).
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # Every export reuses the same file names, so browsers must revalidate rather than cache
    # blindly — a stale index.pck against a new index.wasm won't start. ETags keep an
    # unchanged file to a 304.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
