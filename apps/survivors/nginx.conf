server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects (the old root links to /play/, /play to /play/) say only the path: behind the
    # proxy this server sees http on port 80, which an absolute Location would send people to.
    absolute_redirect off;

    # The game's index.wasm, index-<hash>.pck package and index.js (under /play/) and the 官网's
    # index.html are pre-gzipped at image build (see Dockerfile).
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # Most files keep their names across exports, so browsers must revalidate rather than cache
    # blindly — a stale file against a new index.html won't start. ETags keep an unchanged file
    # to a 304.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The root is the 官网 and the game is at /play/ (.39). Links into the game from before all
    # carry a query (?from=share on every result image's QR code, ?debug=1 for 测试模式), so a root
    # with one goes on to the game with it; the bare root is the site.
    location = / {
        if ($args) {
            return 302 /play/$is_args$args;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # The game package is named after its contents (game/tools/export_web.sh), so a given name
    # never changes: browsers keep it without asking again.
    location ~ ^/play/index-[0-9a-f]+\.pck$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
