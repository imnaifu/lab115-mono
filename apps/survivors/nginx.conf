server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.wasm, the index-<hash>.pck game package and index.js are pre-gzipped at image build
    # (see Dockerfile).
    gzip_static on;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # Most files keep their names across exports, so browsers must revalidate rather than cache
    # blindly — a stale file against a new index.html won't start. ETags keep an unchanged file
    # to a 304.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # The game package is named after its contents (game/tools/export_web.sh), so a given name
    # never changes: browsers keep it without asking again.
    location ~ ^/index-[0-9a-f]+\.pck$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
