<!-- Home-screen icon. Square with no corner radius on purpose: iOS applies its
     own mask, and a radius baked in here would be rounded twice. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <rect width="180" height="180" fill="#000000"/>
  <g transform="translate(35 56.53) scale(2.3913)" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <path d="M4 4V24"/>
    <path d="M18 4V24"/>
    <path d="M32 4a10 10 0 0 1 0 20"/>
  </g>
</svg>
