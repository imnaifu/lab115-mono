<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="每日严选 Daily Picks">
  <!--
    THE MARK, fixed: a yellow tile with an ink outline and ink strokes, the
    Sokosoko colourway (see favicon.svg for what the mark is and how its
    geometry is derived).

    EVERYTHING THAT CANNOT ANSWER A MEDIA QUERY USES IT: the masthead on the
    light theme (SiteHeader renders it beside mark-cream.svg and lets the `dark:`
    variant choose), `POSTER_MARK` in lib/poster-assets.ts, which Satori draws
    onto the share poster and the OG card, and icon-192/icon-512 in this
    directory.

    IF THIS FILE CHANGES, FOUR THINGS DO NOT FOLLOW IT ON THEIR OWN:
      1. `POSTER_MARK`, a base64 copy of this artwork, minified. Nothing
         enforces that the two agree, and the copy has already been stale once.
      2. The PNGs here. Regenerate them from this file and mark-maskable.svg
         with sharp (a dependency of this app), at 192 and 512.
      3. `VERSION` in sw.js. THIS ONE HAS ALREADY BEEN MISSED: the mark was
         redrawn, the icon filenames stayed, and the service worker was serving
         them cache-first, so every returning reader kept the old logo out of
         its own cache and nothing on the page said so. The icons are
         network-first now, which prevents the next one, but a bump is still the
         only thing that retires caches already written.
      4. favicon.svg, which carries THIS GEOMETRY, and the `?v=` on the icon
         href in app/layout.tsx, which is what makes a redrawn favicon a new
         address. A browser's favicon store ignores `max-age` and survives a hard
         reload, so without a bump the tab can keep an icon that no longer exists
         anywhere on disk.

    Palette from src/index.css: brand #F7C948, ink #2F3542.
  -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#F7C948" stroke="#2F3542" stroke-width="3"/>
  <g transform="translate(32 32) scale(0.88) translate(-32 -32)" fill="none" stroke="#2F3542" stroke-linecap="round">
    <path stroke-width="7" d="M 13.2 21 H 56"/>
    <path stroke-width="7" d="M 13.2 43 H 56"/>
    <path stroke-width="5" d="M 30 25 V 39"/>
    <path stroke-width="5" d="M 42 25 V 39"/>
    <path stroke-width="7" d="M 8 11 A 35 35 0 0 1 8 53"/>
  </g>
</svg>
