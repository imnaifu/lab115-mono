<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="每日干货 Daily Takes">
  <!--
    A pair of quotation marks. A "take" is an argued opinion, which is the one
    thing this digest selects for — the scorer's first question is literally
    "argument or announcement?", and news gets pushed to the 30s. The previous
    icon was an open book, which said "reading", not "opinion".

    An ink tile rather than the site's cream, because the browser tab is where
    this has to survive at 16px: a cream tile on a light tab strip loses its
    edges, and the marks go with them. Checked against a mock tab bar — at that
    size the two-colour split is still what makes it read as two marks.

    Palette from src/index.css: cream #FBF3E9, ink #3B3563, orange #EFA050.
    The paths are generated geometry, not hand-tuned curves; adjusting a control
    point by eye will break the pair's symmetry.
  -->
  <rect width="64" height="64" rx="14" fill="#3B3563"/>
  <path fill="#FBF3E9" d="M 8 23 A 12 12 0 1 1 32 23 C 32 35.0 25.4 44.0 15.8 48.8 L 8.6 39.2 C 18.8 35.6 23.6 30.2 23.6 23 Z"/>
  <path fill="#EFA050" d="M 33 23 A 12 12 0 1 1 57 23 C 57 35.0 50.4 44.0 40.8 48.8 L 33.6 39.2 C 43.8 35.6 48.6 30.2 48.6 23 Z"/>
</svg>
