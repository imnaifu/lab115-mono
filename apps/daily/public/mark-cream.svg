<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="每日严选 Daily Picks">
  <!--
    THE DARK THEME'S MARK, and since the Sokosoko restyle it is the same artwork
    as mark.svg. The yellow tile holds on a dark page by itself; the ink outline
    goes quiet there, which is fine, because the outline only exists to hold the
    tile's edge on a light ground.

    IT IS KEPT AS ITS OWN FILE, under its old name, because SiteHeader and the
    subscribe sheet render the pair and let the `dark:` variant choose. When the
    mark had two colourways (ink tile on the light page, cream tile on the dark
    one) this was the cream one; if it ever needs one of its own again, this is
    where it goes, and nothing that renders it has to change.

    See favicon.svg for the mark and its geometry, and mark.svg for what does
    not follow a change here on its own.

    Palette from src/index.css: brand #F7C948, ink #2F3542.
  -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#F7C948" stroke="#2F3542" stroke-width="3"/>
  <g transform="translate(32 32) scale(0.88) translate(-32 -32)" fill="none" stroke="#2F3542" stroke-linecap="round">
    <path stroke-width="7" d="M 13.2 21 H 56"/>
    <path stroke-width="7" d="M 13.2 43 H 56"/>
    <path stroke-width="5" d="M 30 25 V 39"/>
    <path stroke-width="5" d="M 42 25 V 39"/>
    <path stroke-width="7" d="M 8 11 A 35 35 0 0 1 8 53"/>
  </g>
</svg>
