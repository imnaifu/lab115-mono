server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # index.html and the voice manifest keep their names across deploys: revalidate (ETag → 304).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Vite names bundles after their contents, so a given name never changes.
    # (Quoted: a regex containing braces would otherwise end the directive.)
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Clip names are hashes of the sentence and every voice setting (src/voice/cache.ts): same
    # name, same audio.
    location ~ ^/__simlab/voice/[0-9a-f]+\.wav$ {
        # nginx's stock mime.types has no wav.
        types { audio/wav wav; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
