# Multi-app orchestration. Each service is an INDEPENDENT app under apps/<name>/
# with its own Dockerfile (Next.js, or a plain static site behind nginx — see
# apps/english, whose code stays in the repo though it is no longer deployed).
# Coolify builds each from its own context (strategy A), and Traefik routes
# 每个域名 to its container.
#
# ── Add a new tool ──────────────────────────────────────────────────────────
#   1. Drop the project into apps/<name>/ (with its own Dockerfile)
#   2. Copy a service block below, then change:
#        - the service name          (→ <name>)
#        - build.context             (./apps/<name>)
#        - every occurrence of the name in labels (router/service names)
#        - the Host(`...`) domain
#        - loadbalancer.server.port  (Next.js: 3000, nginx static: 80)
#   3. Point the subdomain's DNS at the server, then `git push`.
services:
  # The root domain. Two Host rules rather than one because `www` is a separate
  # certificate SAN to Traefik — a single rule would leave www.lab115.com
  # unrouted, and an apex-only site still gets typed with the www in front.
  home:
    build:
      context: ./apps/home
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTP → HTTPS redirect
      - traefik.http.routers.home-http.entryPoints=http
      - traefik.http.routers.home-http.rule=Host(`lab115.com`) || Host(`www.lab115.com`)
      - traefik.http.routers.home-http.middlewares=redirect-to-https
      # HTTPS router (Let's Encrypt via Coolify's Traefik resolver)
      - traefik.http.routers.home-https.entryPoints=https
      - traefik.http.routers.home-https.rule=Host(`lab115.com`) || Host(`www.lab115.com`)
      - traefik.http.routers.home-https.tls=true
      - traefik.http.routers.home-https.tls.certresolver=letsencrypt
      - traefik.http.routers.home-https.middlewares=gzip
      # Next.js listens on 3000 inside the container
      - traefik.http.services.home.loadbalancer.server.port=3000

  converter:
    build:
      context: ./apps/converter
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTP → HTTPS redirect
      - traefik.http.routers.converter-http.entryPoints=http
      - traefik.http.routers.converter-http.rule=Host(`converter.lab115.com`)
      - traefik.http.routers.converter-http.middlewares=redirect-to-https
      # HTTPS router (Let's Encrypt via Coolify's Traefik resolver)
      - traefik.http.routers.converter-https.entryPoints=https
      - traefik.http.routers.converter-https.rule=Host(`converter.lab115.com`)
      - traefik.http.routers.converter-https.tls=true
      - traefik.http.routers.converter-https.tls.certresolver=letsencrypt
      - traefik.http.routers.converter-https.middlewares=gzip
      # Next.js listens on 3000 inside the container
      - traefik.http.services.converter.loadbalancer.server.port=3000

  daily:
    # Website AND worker in one container: Next.js serves daily.lab115.com,
    # while its instrumentation hook registers the node-cron job that fetches
    # the blogs, summarizes them and pushes the result to github.com/imnaifu/files.
    # See apps/daily/README.md for the env vars and the JSON contract.
    build:
      context: ./apps/daily
    restart: unless-stopped
    # Docker's tini as PID 1, so orphaned children get reaped. Without it
    # next-server IS PID 1, and the 15-minute repo sync left one zombie `git`
    # behind per run (~100 a day, cleared only by a redeploy) — Node only reaps
    # the children it spawned itself, never the orphans the kernel hands to PID 1.
    init: true
    environment:
      # SECRETS ONLY. The cron, the timezone, the model, the repo slug and the
      # rest were all passed through here with the same default the code already
      # carried, which bought nothing but a second place to look — they are
      # constants in src/lib/config.ts now, changed by a commit and a redeploy.
      # (DAILY_TOP_N was declared here and read by no code at all.)
      - NODE_ENV=production
      - PORT=3000
      # The container's clock. Distinct from the publication timezone, which is
      # the TZ constant in src/lib/config.ts.
      - TZ=America/Los_Angeles
      # DeepSeek key from https://platform.deepseek.com/api_keys
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Claude Haiku writes the summaries when this is set; empty falls back to
      # DeepSeek for those too. See SUMMARY_MODEL in apps/daily/src/lib/config.ts.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Fine-grained PAT with contents:write on the digest repo. The container
      # has no SSH key, so HTTPS + token is the only route here (locally you can
      # set GIT_REMOTE to an SSH URL instead — see apps/daily/README.md).
      - GIT_TOKEN=${DAILY_GIT_TOKEN:-}
      # Email subscriptions. Empty RESEND_API_KEY turns the feature off entirely.
      # The subscriber list lives in Resend, not in this repo or the volume —
      # see the note above MAIL_SEGMENT in apps/daily/src/lib/config.ts.
      #
      # NOT `${DAILY_RESEND_API_KEY}`, which is what these two read for a while
      # and what kept subscriptions closed on the live site: the app reads
      # `RESEND_API_KEY`, the deployment checklist said to set `RESEND_API_KEY`,
      # and this line quietly overwrote it with an unset `DAILY_`-prefixed
      # variable — `:-` making that an empty string rather than an error. One name
      # per credential now, the same on the host and in the container.
      #
      # The prefix existed because a second service — the xhs-watcher worker,
      # which is no longer deployed from this file — took an unprefixed
      # `RESEND_API_KEY` for its own digest. Nothing competes for the name now.
      # `DAILY_GIT_TOKEN` above keeps its prefix for the opposite reason:
      # `GIT_TOKEN` is a name half the world sets for something else, and it is
      # not what any app here reads.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_SECRET=${MAIL_SECRET:-}
      # Cloudflare D1 token for the signup log — see CF_D1_TOKEN in
      # apps/daily/src/lib/config.ts. Empty records nothing and breaks nothing.
      - CF_D1_TOKEN=${CF_D1_TOKEN:-}
      # Cloudflare Turnstile secret for the subscribe form. Its site key is a
      # constant in apps/daily/src/lib/turnstile-key.ts and must ship in the
      # same deploy — see lib/turnstile.ts for what a mismatch does.
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      # The password for /admin, the scoring dashboard. Empty means that route
      # 404s rather than 401s — see ADMIN_PASSWORD in apps/daily/src/lib/config.ts
      # for why an unconfigured deployment should not announce it exists.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      # The git clone of the digest repo. It is both the job's workspace and the
      # site's read path, so the pages never hit the network. Share posters are
      # rendered per request and never written here — see lib/poster-serve.ts.
      #
      # /app/data, NOT /data: the app resolves its data directory as the relative
      # `./data` against the Dockerfile's WORKDIR of /app, hardcoded rather than
      # configured — see DATA_DIR in src/lib/config.ts for why. The host side is
      # unchanged, so this moved without moving any data.
      - ./data/daily:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTP → HTTPS redirect
      - traefik.http.routers.daily-http.entryPoints=http
      - traefik.http.routers.daily-http.rule=Host(`daily.lab115.com`)
      - traefik.http.routers.daily-http.middlewares=redirect-to-https
      # HTTPS router
      - traefik.http.routers.daily-https.entryPoints=https
      - traefik.http.routers.daily-https.rule=Host(`daily.lab115.com`)
      - traefik.http.routers.daily-https.tls=true
      - traefik.http.routers.daily-https.tls.certresolver=letsencrypt
      - traefik.http.routers.daily-https.middlewares=gzip
      # Next.js listens on 3000 inside the container
      - traefik.http.services.daily.loadbalancer.server.port=3000

  # No env beyond the defaults and no volume: the game is stateless, and the
  # story templates are compiled into the server bundle (apps/madlibs/README.md).
  madlibs:
    build:
      context: ./apps/madlibs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTP → HTTPS redirect
      - traefik.http.routers.madlibs-http.entryPoints=http
      - traefik.http.routers.madlibs-http.rule=Host(`madlibs.lab115.com`)
      - traefik.http.routers.madlibs-http.middlewares=redirect-to-https
      # HTTPS router
      - traefik.http.routers.madlibs-https.entryPoints=https
      - traefik.http.routers.madlibs-https.rule=Host(`madlibs.lab115.com`)
      - traefik.http.routers.madlibs-https.tls=true
      - traefik.http.routers.madlibs-https.tls.certresolver=letsencrypt
      - traefik.http.routers.madlibs-https.middlewares=gzip
      # Next.js listens on 3000 inside the container
      - traefik.http.services.madlibs.loadbalancer.server.port=3000

  # 大厂幸存者 (Big Tech Survivors), a Godot game (apps/survivors/game/). The image exports it to a web build and
  # serves that with nginx, so building it downloads Godot (apps/survivors/README.md).
  survivors:
    build:
      context: ./apps/survivors
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTP → HTTPS redirect
      - traefik.http.routers.survivors-http.entryPoints=http
      - traefik.http.routers.survivors-http.rule=Host(`survivors.lab115.com`)
      - traefik.http.routers.survivors-http.middlewares=redirect-to-https
      # HTTPS router
      - traefik.http.routers.survivors-https.entryPoints=https
      - traefik.http.routers.survivors-https.rule=Host(`survivors.lab115.com`)
      - traefik.http.routers.survivors-https.tls=true
      - traefik.http.routers.survivors-https.tls.certresolver=letsencrypt
      - traefik.http.routers.survivors-https.middlewares=gzip
      # nginx listens on 80 inside the container
      - traefik.http.services.survivors.loadbalancer.server.port=80

  # The game's backend at nakama.lab115.com: Nakama (open-source game server, Heroic Labs) keeps
  # each player's 云存档 — an anonymous account per device, a 存档码 to bring it to another — and
  # is where the App's sign-ins and purchases will go (apps/survivors/game/scripts/cloud.gd,
  # apps/survivors/README.md). The game talks to it straight from the browser: Nakama answers
  # any origin (CORS) and the session is a bearer token, not a cookie.
  nakama:
    # Pinned, like umami: starting a newer version migrates the database, which should come with
    # a version bump here rather than by surprise.
    image: heroiclabs/nakama:3.41.0
    restart: unless-stopped
    depends_on:
      nakama-db:
        condition: service_healthy
    environment:
      # The secret (`openssl rand -hex 24`: hex, so it fits a database address as is).
      - NAKAMA_SECRET=${NAKAMA_SECRET:-}
      # The admin console's password, typed into a web page (nakama-admin.lab115.com), so of its
      # own: whoever learns it still holds none of the keys above.
      - NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD:-}
    # Nakama takes its settings as flags. `$$` leaves each `$` to the container's shell, so they
    # are worked out from the secret when it starts: it is the database's password, and each
    # signing key (players' sessions and refresh tokens, server-to-server calls, console logins) is
    # a hash of it with what the key is for, so they all differ and nobody has to keep them. `:?`
    # stops it there, loudly, when the secret or the console's password is missing, instead of
    # running with Nakama's documented defaults, with which anyone could sign in as any player.
    # The server key ships in the game (Cloud.SERVER_KEY) and is no secret. A session lasts two
    # hours; a device signs in again with its id whenever it needs a new one.
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${NAKAMA_SECRET:?}" "$${NAKAMA_CONSOLE_PASSWORD:?}"
        key() { printf '%s' "$${NAKAMA_SECRET}:$$1" | sha256sum | cut -d ' ' -f 1; }
        database="nakama:$${NAKAMA_SECRET}@nakama-db:5432/nakama"
        /nakama/nakama migrate up --database.address "$$database"
        exec /nakama/nakama --name nakama1 \
          --database.address "$$database" \
          --logger.level INFO \
          --socket.server_key survivors-lab115 \
          --session.token_expiry_sec 7200 \
          --session.encryption_key "$$(key session)" \
          --session.refresh_encryption_key "$$(key refresh)" \
          --runtime.http_key "$$(key http)" \
          --console.username chopper \
          --console.password "$${NAKAMA_CONSOLE_PASSWORD}" \
          --console.signing_key "$$(key console)"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The admin console (7351) is at nakama-admin.lab115.com behind Cloudflare Access: the edge
    # lets only xnaifu@gmail.com through, with a one-time PIN mailed to it (Zero Trust app
    # "Nakama admin (survivors)"), and Nakama's own login comes after that. Access only guards the
    # way through Cloudflare, so this router also refuses anything not coming from Cloudflare's
    # addresses (cloudflare.com/ips): a request sent straight to the server with that Host can't
    # skip it. The server itself still reaches the console without either, through
    # `ssh -L 7351:127.0.0.1:7351 mydev` and then http://127.0.0.1:7351.
    ports:
      - "127.0.0.1:7351:7351"
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTP → HTTPS redirect
      - traefik.http.routers.nakama-http.entryPoints=http
      - traefik.http.routers.nakama-http.rule=Host(`nakama.lab115.com`)
      - traefik.http.routers.nakama-http.middlewares=redirect-to-https
      - traefik.http.routers.nakama-http.service=nakama
      # HTTPS router
      - traefik.http.routers.nakama-https.entryPoints=https
      - traefik.http.routers.nakama-https.rule=Host(`nakama.lab115.com`)
      - traefik.http.routers.nakama-https.tls=true
      - traefik.http.routers.nakama-https.tls.certresolver=letsencrypt
      - traefik.http.routers.nakama-https.middlewares=gzip
      # Two services on one container: every router names its own.
      - traefik.http.routers.nakama-https.service=nakama
      # The game's API (HTTP and WebSocket)
      - traefik.http.services.nakama.loadbalancer.server.port=7350
      # The admin console, see above
      - traefik.http.middlewares.cloudflare-only.ipallowlist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - traefik.http.routers.nakama-admin-http.entryPoints=http
      - traefik.http.routers.nakama-admin-http.rule=Host(`nakama-admin.lab115.com`)
      - traefik.http.routers.nakama-admin-http.middlewares=redirect-to-https
      - traefik.http.routers.nakama-admin-http.service=nakama-admin
      - traefik.http.routers.nakama-admin-https.entryPoints=https
      - traefik.http.routers.nakama-admin-https.rule=Host(`nakama-admin.lab115.com`)
      - traefik.http.routers.nakama-admin-https.tls=true
      - traefik.http.routers.nakama-admin-https.tls.certresolver=letsencrypt
      - traefik.http.routers.nakama-admin-https.middlewares=cloudflare-only,gzip
      - traefik.http.routers.nakama-admin-https.service=nakama-admin
      - traefik.http.services.nakama-admin.loadbalancer.server.port=7351

  nakama-db:
    # Its own database rather than a second one in umami-db: either can then be upgraded, backed
    # up or dropped alone. No ports and no Traefik labels; only nakama talks to it.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_USER=nakama
      # Empty, the postgres image refuses to initialise: the loud failure wanted, as with umami-db.
      - POSTGRES_PASSWORD=${NAKAMA_SECRET:-}
    volumes:
      - ./data/nakama-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Simulation Lab (apps/simulation-lab): the interactive preview of the simulation videos, a
  # static Vite build behind nginx with the published narration clips. Rendering stays local.
  video:
    build:
      context: ./apps/simulation-lab
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTP → HTTPS redirect
      - traefik.http.routers.video-http.entryPoints=http
      - traefik.http.routers.video-http.rule=Host(`video.lab115.com`)
      - traefik.http.routers.video-http.middlewares=redirect-to-https
      # HTTPS router
      - traefik.http.routers.video-https.entryPoints=https
      - traefik.http.routers.video-https.rule=Host(`video.lab115.com`)
      - traefik.http.routers.video-https.tls=true
      - traefik.http.routers.video-https.tls.certresolver=letsencrypt
      - traefik.http.routers.video-https.middlewares=gzip
      # nginx listens on 80 inside the container
      - traefik.http.services.video.loadbalancer.server.port=80

  # Self-hosted analytics at stats.lab115.com, running ALONGSIDE GA rather than
  # instead of it. GA's script barely loads from mainland China, so a reader
  # there was invisible; this one is served from our own domain through the same
  # Cloudflare edge as daily itself — a reader who can open the site can load it.
  umami:
    # A pinned release, not `latest`: a redeploy runs Prisma migrations against
    # the database, and that should happen on a version bump, not by surprise.
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    init: true
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET:-}
      # Not `script.js` / `/api/send`: blocker lists match Umami's defaults, and
      # a blocked tracker undercounts in exactly the way GA already does.
      - TRACKER_SCRIPT_NAME=s.js
      - COLLECT_API_ENDPOINT=/api/c
      - DISABLE_TELEMETRY=1
    depends_on:
      umami-db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      # HTTP → HTTPS redirect
      - traefik.http.routers.umami-http.entryPoints=http
      - traefik.http.routers.umami-http.rule=Host(`stats.lab115.com`)
      - traefik.http.routers.umami-http.middlewares=redirect-to-https
      # HTTPS router
      - traefik.http.routers.umami-https.entryPoints=https
      - traefik.http.routers.umami-https.rule=Host(`stats.lab115.com`)
      - traefik.http.routers.umami-https.tls=true
      - traefik.http.routers.umami-https.tls.certresolver=letsencrypt
      - traefik.http.routers.umami-https.middlewares=gzip
      - traefik.http.services.umami.loadbalancer.server.port=3000

  umami-db:
    # No ports and no Traefik labels: only umami talks to it, over the compose
    # network. An empty UMAMI_DB_PASSWORD makes the postgres image refuse to
    # initialise, which is the loud failure wanted here rather than a database
    # with no password.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-}
    volumes:
      - ./data/umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 5
