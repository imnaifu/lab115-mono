name: CI

# Quality gate only — deployment is handled by Coolify's native git integration
# (push to main → Coolify builds docker-compose.yml and redeploys).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Auto-discover the apps under apps/ so new tools are covered without editing
  # this workflow.
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          apps=$(ls -d apps/*/ | xargs -n1 basename | jq -R . | jq -cs .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Apps pick their own package manager (daily and word-match-nextjs are on
      # yarn, the rest on npm), so detect it from the lockfile instead of
      # hardcoding one. Both forms are the strict, lockfile-respecting variant —
      # a build must never resolve a dependency the lockfile didn't pin.
      # setup-node's built-in cache is skipped on purpose: it needs the package
      # manager named up front, which is exactly what varies here.
      - name: Install dependencies
        run: |
          # package-lock.json wins when an app carries both, so apps that pass
          # today keep the exact install path they pass with. Only yarn-only
          # apps change behaviour.
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile --non-interactive
          else
            echo "::error::apps/${{ matrix.app }} has no yarn.lock or package-lock.json"
            exit 1
          fi
      - run: npm run build
